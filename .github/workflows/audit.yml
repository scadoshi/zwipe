name: Security audit

# Scans Cargo.lock against the RustSec Advisory DB (https://rustsec.org). Fails
# — which emails the repo owner — when a dependency (direct or transitive) has a
# known vulnerability. Runs weekly to catch newly-published advisories against
# already-pinned deps, and on any lockfile/manifest change to catch a vulnerable
# dep the moment it's introduced. `cargo audit` exits non-zero on vulnerabilities
# only; unmaintained/yanked warnings are reported but don't fail the run.

on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC
  push:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Prebuilt binary — no from-source compile (keeps the run under a minute).
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-audit
      - name: Audit dependencies
        # Reads .cargo/audit.toml, which ignores one advisory on a crate that
        # is locked but never built; the next step keeps that true.
        run: cargo audit
      - name: SQLite stays out of the build
        # libsqlite3-sys is locked only as sqlx's unused optional SQLite
        # driver (issue 320). If anything ever builds it, the advisory
        # ignored in .cargo/audit.toml applies, so this fails.
        run: |
          cargo tree -i libsqlite3-sys --target all -e normal,build > sqlite-tree.txt 2> /dev/null || true
          if [ -s sqlite-tree.txt ]; then
            echo "libsqlite3-sys is now in the build graph:"
            cat sqlite-tree.txt
            exit 1
          fi
