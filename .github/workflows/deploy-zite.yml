name: Deploy zite

on:
  push:
    branches: [main]
    paths:
      - 'zite/**'
      - 'zwipe-core/**'
      - 'components/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy-zite.yml'
  workflow_dispatch:

# Read-only throughout; the Cloudflare deploy authenticates with its own token.
permissions:
  contents: read

concurrency:
  group: zite-deploy
  cancel-in-progress: false

jobs:
  # Gate the build/deploy on the test suite. Full core + zerver suite (not just
  # core) since zite is growing into the authenticated web app that will exercise
  # sessions and server behavior directly.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6 # the VPS version; a tag that moves is not a pin
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      SQLX_OFFLINE: "true" # compile against committed .sqlx; #[sqlx::test] uses DATABASE_URL at runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # nextest runs every test from every binary in one parallel queue, where
      # cargo test runs the 39 binaries one after another. Each #[sqlx::test]
      # gets its own database, so they are safe side by side.
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-nextest
      - name: Test
        run: cargo nextest run -p zwipe-core -p zerver
      # nextest does not run doctests.
      - name: Doctests
        run: cargo test --doc -p zwipe-core -p zerver

  # Format + lint gate (the build below needs it too).
  lint:
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
      # zwiper's build.rs bakes these in; placeholders satisfy it for a lint build.
      BACKEND_URL: https://example.invalid
      RUST_LOG: info
      RUST_BACKTRACE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: rustfmt
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # zwiper's default (mobile) feature builds against webkit/GTK on Linux.
      # Cached by package list, so a hit restores the files without apt-get
      # update or downloads (about a minute on a cold install).
      - name: Install Dioxus system libraries
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libdbus-1-dev
          version: 1
      - name: Format
        run: cargo +nightly fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: UI tests
        run: cargo test -p components -p zite -p zwiper
      - name: Clippy (zite server feature)
        # `--workspace` lints default features, which for zite is `web`. The
        # `server` feature is what `dx build --ssg` compiles to enumerate and
        # prerender routes, and nothing else lints it, so a warning there is
        # invisible until someone runs this by hand.
        run: cargo clippy -p zite --all-targets --features server -- -D warnings
      # Broken intra-doc links and other rustdoc warnings fail the way clippy's do.
      - name: Docs
        run: cargo doc --workspace --no-deps --lib
        env:
          RUSTDOCFLAGS: -D warnings
      # zite is a binary crate, which --lib skips; it has no name collision of its own.
      - name: Docs (zite)
        run: cargo doc --no-deps -p zite
        env:
          RUSTDOCFLAGS: -D warnings

  build:
    needs: [test, lint] # blocked if tests or lints fail
    runs-on: ubuntu-latest
    # actions: read lets the bake below see this commit's zerver deploy.
    permissions:
      contents: read
      actions: read
    # Backstop: a normal run is well under 10 minutes. Without this a wedged
    # step burns the default job limit before anyone notices.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        # Caches the compiled dependency graph (native + wasm). Prunes zite's own
        # artifacts so the cache stays lean, and uses restore-keys for partial
        # hits when Cargo.lock changes — far better hit rate than a raw target/ cache.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: zite
          cache-all-crates: true

      - name: Install system dependencies
        # build-essential provides the gcc linker the wasm and native builds use.
        #
        # binaryen is deliberately NOT installed here. dx 0.7.10 never consults
        # PATH for wasm-opt: it downloads its own pinned binaryen (129) and runs
        # that, so an apt binaryen (108 on noble) was only ever dead weight.
        #
        # Caching that download was tried and abandoned (runs 35877063911,
        # 35878341108). dx keeps the tool at ~/.dx/tools on macOS, but on the
        # Linux runner a post-build `find $HOME -maxdepth 6 -name wasm-opt`
        # returns nothing, so there is no directory to cache. The fetch costs
        # 2.4s, so this is only worth revisiting if GitHub refuses it again the
        # way it did on 2026-08-12.
        #
        # apt is the only step here that talks to a network mirror, and it is
        # the one that wedges: on 2026-08-18 it sat for 26 minutes with GitHub
        # reporting no incident. So it gets explicit acquire timeouts, three
        # attempts, and a step timeout, which turns a mirror stall into a fast
        # failure you can re-run instead of a job that hangs unnoticed.
        timeout-minutes: 6
        run: |
          set -euo pipefail
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          for attempt in 1 2 3; do
            if sudo apt-get $APT_OPTS update \
              && sudo apt-get $APT_OPTS install -y build-essential; then
              exit 0
            fi
            echo "apt attempt $attempt failed, retrying" >&2
            sleep $((attempt * 10))
          done
          echo "apt failed three times; the mirror is likely degraded" >&2
          exit 1

      - name: Install dioxus-cli
        # Fetches a prebuilt dx binary instead of compiling dioxus-cli from
        # source (which a `cargo install --force` would do on every run, ~minutes).
        # Keep this matched to the workspace dioxus version (and the build
        # Macs' `dx --version`) — a mismatch is a warning today but dx treats
        # it as incompatible.
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: dioxus-cli@0.7.10

      - name: Wait for this commit's zerver deploy
        # A push that changes zerver deploys it in parallel with this run, so
        # the counters are baked once that deploy is over and come from the
        # zerver this push ships. A push that leaves zerver alone has no
        # zerver run and waits for nothing; at most 20 minutes either way.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 60); do
            state=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "Deploy zerver" --commit "$GITHUB_SHA" --json status -q '.[0].status // "none"')
            case "$state" in
              none|completed) echo "zerver deploy: $state"; exit 0 ;;
            esac
            sleep 20
          done
          echo "::warning::zerver deploy still running after 20 minutes; baking anyway"

      - name: Refresh the public counters from zerver
        # zite/src/metrics.json is committed, so the build has numbers whatever
        # happens here. The new answer replaces it only when all three counts
        # came back as numbers. The query string is this run's own, so no edge
        # copy matches it and the answer comes from the origin.
        run: |
          if curl -fsS --max-time 20 "https://api.zwipe.net/api/marketing/stats?bake=${GITHUB_RUN_ID}" -o metrics.new \
            && jq -e '(.cards_swiped|numbers) and (.searches|numbers) and (.decks_created|numbers)' metrics.new > /dev/null; then
            jq -n --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --slurpfile m metrics.new '{fetched_at:$at, metrics:$m[0]}' > zite/src/metrics.json
            rm metrics.new
            echo "refreshed: $(jq -c .metrics zite/src/metrics.json)"
          else
            rm -f metrics.new
            echo "::warning::zerver gave no complete answer; building with the committed snapshot"
          fi

      - name: Build (SSG)
        working-directory: zite
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: gcc
        # --ssg pre-renders every route returned from the app's static_routes
        # server function into target/dx/zite/release/web/public/<route>/index.html.
        # The wasm bundle still hydrates after load. Dynamic routes
        # (/verify/:token, /reset/:token) are excluded automatically and fall
        # back to SPA hydration: Cloudflare serves index.html for them.
        #
        # --force-sequential is required: it builds the client first, then runs
        # the server + SSG step. Without it, the parallel client build finishes
        # last and overwrites the SSG'd public/index.html with the bare shell.
        run: dx build --release --platform web --ssg --force-sequential

      - name: Upload the site
        # upload-pages-artifact packs the build as one tarball artifact named
        # github-pages; the Cloudflare job below unpacks it. Nothing deploys to
        # GitHub Pages any more.
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: target/dx/zite/release/web/public

  # zwipe.net is the Cloudflare Pages project zwipe-site, where the share
  # page's Pages Function serves each deck's own link-preview tags. It needs
  # the repo secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit)
  # and CLOUDFLARE_ACCOUNT_ID, the same ones deploy-web.yml uses.
  deploy-cloudflare:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: zite/functions

      - name: Download the Pages artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: pages-artifact

      - name: Unpack the site
        # The artifact is one tarball. Cloudflare serves index.html with a 200
        # for a path it has no file for only while there is no 404.html.
        run: |
          mkdir site
          tar -xf pages-artifact/artifact.tar -C site

      - name: Deploy to Cloudflare Pages
        # Run from zite/ so wrangler bundles zite/functions with the upload.
        # The project is created on the first run; --branch main publishes to
        # production.
        working-directory: zite
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          WRANGLER="npx --yes wrangler@4.151.2"
          if ! $WRANGLER pages project list | grep -q "zwipe-site"; then
            $WRANGLER pages project create zwipe-site --production-branch main
          fi
          $WRANGLER pages deploy ../site \
            --project-name zwipe-site \
            --branch main \
            --commit-hash "${GITHUB_SHA}" \
            --commit-dirty=true
