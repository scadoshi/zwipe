[package]
name = "zerver"
version.workspace = true
edition = "2024"

[lints]
workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }   # ServiceExt::oneshot
http-body-util = "0.1"                             # collect response bodies

[lib]
name = "zwipe"
path = "src/lib/lib.rs"

[[bin]]
name = "zerver"
path = "src/bin/zerver.rs"

[[bin]]
name = "zervice"
path = "src/bin/zervice.rs"

[dependencies]

axum = { version = "0.8" }
axum-extra = { version = "0.12", features = ["typed-header"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace", "catch-panic", "limit", "timeout", "request-id", "util", "compression-gzip", "compression-br", "set-header"] }
tower_governor = { version = "0.8" }
tokio = { workspace = true }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json"] }
sqlx-macros = { version = "0.9" }
strum = { version = "0.28", features = ["derive"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
argon2 = { version = "0.5", features = ["std"] }
urlencoding = { version = "2.1.3" }
derive_more = { version = "2.0.1", features = ["deref", "deref_mut", "display", "from", "from_str", "into_iterator"] }
itertools = { version = "0.14.0" }
dashmap = { version = "6" }

# Shared dependencies (always available)
zwipe-core = { path = "../zwipe-core" }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
email_address = { workspace = true }
dotenvy = { workspace = true }
once_cell = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
flate2 = "1"
