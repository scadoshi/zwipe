[workspace]
members = [
    "zerver",
    "zwiper",
    "zwipe-core",
    "components",
    "zite",
    "zwipe-client",
    "zwipe-tui",
]
resolver = "2"

[workspace.package]
version = "1.16.2"

[workspace.dependencies]
anyhow = "1.0.100"
dotenvy = "0.15"
email_address = "0.2.9"
hex = "0.4.3"
once_cell = "1.21.3"
rand = "0.10"
serde_json = "1.0.145"
serde_with = "3.11"
sha2 = "0.11"
thiserror = "2.0.17"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.dependencies.chrono]
version = "0.4.42"
features = ["serde"]

[workspace.dependencies.reqwest]
version = "0.12.23"
features = ["json", "rustls-tls", "http2"]
default-features = false

[workspace.dependencies.serde]
version = "1.0"
features = ["derive"]

[workspace.dependencies.tokio]
version = "1.47.1"
features = ["full"]

[workspace.dependencies.uuid]
version = "1.18.1"
features = [
    "v4",
    "rng-rand",
    "serde",
]

# scadoshi-rust lints, from scadoshi-rust/lints/lints.toml. Every member opts
# in with `[lints] workspace = true`. Thresholds live in clippy.toml.
#
# CI makes warnings errors: cargo clippy --all-targets -- -D warnings
# Silence a lint on one item, with a reason:
#     #[expect(clippy::as_conversions, reason = "u8 to char is lossless here")]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Pedantic lints that cost more than they catch.
module_name_repetitions = "allow"
# Library crates flip this to "warn": builders and pure functions get #[must_use].
must_use_candidate = "allow"

# Docs: # Errors and # Panics sections everywhere.
missing_errors_doc = "warn"
missing_panics_doc = "warn"

# Never ship.
todo = "deny"
dbg_macro = "deny"
unimplemented = "deny"

# No panics outside tests (clippy.toml allows them inside tests).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
panic_in_result_fn = "deny"
exit = "deny"
unreachable = "deny"

# Suppressions are #[expect] with a reason, so stale ones surface.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Unsafe explains itself, one operation per block.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "warn"

# Casts and arithmetic that can silently lose information.
as_conversions = "warn"
arithmetic_side_effects = "warn"

# API shape.
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
too_many_arguments = "warn"
large_enum_variant = "warn"
redundant_clone = "warn"
needless_collect = "warn"
or_fun_call = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"

# Logging goes through tracing; a CLI's own output takes an #[expect].
print_stdout = "warn"
print_stderr = "warn"

[profile.android-dev]
inherits = "dev"

[profile.server-dev]
inherits = "dev"

[profile.wasm-dev]
opt-level = 1
inherits = "dev"

# dx builds web wasm under this profile. Without it the dioxus-cli default
# keeps debug info, and wasm-opt aborts inside binaryen's DWARF emitter
# (SIGABRT, DWARFEmitter.cpp:201). dx logs that as ERROR and still exits 0, so
# the build stays green and ships an unoptimized binary. Cargo only honors
# profiles in the workspace root, so this cannot live in zite/Cargo.toml.
[profile.wasm-release]
inherits = "release"
strip = "debuginfo"

# tao 0.37.0 vendored as 0.34.9. See vendor/tao/VENDOR.md.
[patch.crates-io]
tao = { path = "vendor/tao" }
