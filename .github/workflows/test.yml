name: Test

# Pre-merge signal on pull requests. Pushes to main gate on the inline `test`
# job in deploy-zerver.yml / deploy-zite.yml, so this stays PR-only — no point
# running the suite twice on a push.

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6 # the VPS version; a tag that moves is not a pin
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Compile the query! macros against the committed .sqlx offline data, NOT
      # the empty service DB. #[sqlx::test] still uses DATABASE_URL at runtime to
      # create + migrate a fresh DB per test. (.sqlx drift is guarded by the
      # deploy workflow's `cargo sqlx prepare --check`.)
      SQLX_OFFLINE: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Named crates, never --workspace: on a headless Linux runner, compiling
      # zwiper pulls Dioxus desktop's GTK stack (glib-sys) and fails.
      # zwipe-client is safe to name here: reqwest only, no Dioxus.
      # nextest runs every test from every binary in one parallel queue, where
      # cargo test runs the 39 binaries one after another. Each #[sqlx::test]
      # gets its own database, so they are safe side by side.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-nextest
      - name: Test
        run: cargo nextest run -p zwipe-core -p zerver -p zwipe-client
      # nextest does not run doctests.
      - name: Doctests
        run: cargo test --doc -p zwipe-core -p zerver -p zwipe-client

  # Format + lint gate. fmt runs workspace-wide (parse-only, no GTK); clippy is
  # scoped to zwipe-core + zerver for the same headless-GTK reason as Test.
  lint:
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true" # clippy compiles the query! macros against committed .sqlx
      # zwiper's build.rs bakes these in; placeholders satisfy it for a lint build.
      BACKEND_URL: https://example.invalid
      RUST_LOG: info
      RUST_BACKTRACE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # nightly first, stable last so `cargo`/`cargo clippy` default to stable;
      # nightly is only for `cargo +nightly fmt` (rustfmt.toml uses the unstable
      # unstable import rules, which stable rustfmt ignores).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: rustfmt
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # zwiper's default (mobile) feature builds against webkit/GTK on Linux.
      # Cached by package list, so a hit restores the files without apt-get
      # update or downloads (about a minute on a cold install).
      - name: Install Dioxus system libraries
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libdbus-1-dev
          version: 1
      - name: Format
        run: cargo +nightly fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Broken intra-doc links and other rustdoc warnings fail the way clippy's do.
      - name: Docs
        run: cargo doc --workspace --no-deps --lib
        env:
          RUSTDOCFLAGS: -D warnings
      # zite is a binary crate, which --lib skips; it has no name collision of its own.
      - name: Docs (zite)
        run: cargo doc --no-deps -p zite
        env:
          RUSTDOCFLAGS: -D warnings
      - name: UI tests
        run: cargo test -p components -p zite -p zwiper
