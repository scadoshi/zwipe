[package]
name = "zwiper-tui"
version.workspace = true
authors = ["scottyrayfermo"]
edition = "2024"
description = "ZWIPE in the terminal: build Magic decks by swiping with the keyboard"

[lints]
workspace = true

[lib]
name = "zwiper_tui"
path = "src/lib/lib.rs"

[[bin]]
name = "zwiper-tui"
path = "src/bin/zwiper-tui.rs"

[dependencies]
zwipe-core = { path = "../zwipe-core" }
zwipe-client = { path = "../zwipe-client" }
anyhow = { workspace = true }
chrono = { workspace = true }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
email_address = { workspace = true }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
