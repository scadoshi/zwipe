name: Deploy web

# Builds zwiper-web and uploads it to the Cloudflare Pages project zwipe-app,
# served at app.zwipe.net. Runs on a push to main that touches the web app or
# anything it builds from, and by hand from the Actions tab. It needs the repo
# secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and
# CLOUDFLARE_ACCOUNT_ID.
#
# The tests and the release build run side by side; the upload waits on both,
# so a deploy takes the longer of the two, not their sum. It also waits on
# Deploy zerver when the same commit started one, so the web never goes live
# ahead of a server that failed to deploy.
on:
  push:
    branches: [main]
    paths:
      - 'zwiper-web/**'
      - 'zwipe-core/**'
      - 'zwipe-client/**'
      - 'zwipe-ui/**'
      - 'components/**'
      - 'Cargo.lock'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a deploy still running; the site only ever needs
# the latest build.
concurrency:
  group: deploy-web
  cancel-in-progress: true

env:
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: web-test

      # zwipe-ui and zwipe-client are tested here, the one push workflow whose
      # paths include them; test.yml also runs them, but only on pull requests.
      - name: Test
        run: cargo test -p zwiper-web -p zwipe-ui -p zwipe-client

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The API the build talks to; build.rs bakes it in.
      BACKEND_URL: https://api.zwipe.net
      # The build's name, baked in by build.rs and written to version.json
      # below, which the app compares on a page change to find a newer build.
      ZWIPER_BUILD: ${{ github.sha }}
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: web-wasm
          cache-all-crates: true

      - name: Install dioxus-cli
        # A prebuilt dx, matched to the workspace dioxus version, as in
        # deploy-zite.yml; compiling it would cost minutes.
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: dioxus-cli@0.7.10

      - name: Build
        working-directory: zwiper-web
        run: dx build --release --platform web

      - name: Add headers and the version file
        # No 404.html: Pages then serves index.html for every path, and
        # functions/_middleware.js turns a path no route matches into a 404.
        run: |
          cp zwiper-web/deploy/_headers target/dx/zwiper-web/release/web/public/_headers
          printf '{"build":"%s"}\n' "$ZWIPER_BUILD" > target/dx/zwiper-web/release/web/public/version.json

      - name: Hand the site to the deploy job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: target/dx/zwiper-web/release/web/public
          retention-days: 1

  # A push that changes the server and the web starts both deploys at once,
  # and the web build is the faster one. This waits on Deploy zerver's run for
  # the same commit and fails unless it succeeds. A commit with no zerver run
  # (its paths filter skipped it) passes after a short grace, since both runs
  # are created by the same push.
  zerver:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
    steps:
      - name: Wait for Deploy zerver on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest() {
            gh run list -R "$GITHUB_REPOSITORY" -w deploy-zerver.yml -c "$GITHUB_SHA" -L 1 \
              --json status,conclusion,url -q '.[0] // empty | [.status, .conclusion, .url] | join("|")'
          }
          run=""
          for _ in 1 2 3; do
            run=$(latest)
            [ -n "$run" ] && break
            sleep 10
          done
          if [ -z "$run" ]; then
            echo "no Deploy zerver run for $GITHUB_SHA; the web deploys on its own"
            exit 0
          fi
          while :; do
            IFS='|' read -r status conclusion url <<<"$run"
            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then
                echo "Deploy zerver succeeded: $url"
                exit 0
              fi
              echo "::error::Deploy zerver ended '$conclusion' for this commit, so the web stays on its current build: $url"
              exit 1
            fi
            echo "Deploy zerver is $status: $url"
            sleep 30
            run=$(latest)
          done

  deploy:
    needs: [test, build, zerver]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: zwiper-web/functions

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site

      - name: Deploy to Cloudflare Pages
        # Direct Upload; --branch main publishes to production (app.zwipe.net).
        # Run from zwiper-web/ so wrangler bundles zwiper-web/functions, the
        # shared deck link's preview tags, with the upload.
        working-directory: zwiper-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4.151.2 pages deploy ../site
          --project-name zwipe-app
          --branch main
          --commit-hash "${GITHUB_SHA}"
          --commit-dirty=true
