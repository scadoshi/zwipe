<!DOCTYPE html>
<!-- Custom dx shell: copy of dioxus-cli's prod.index.html plus lang="en" on
     the html tag and the script at the end of the body. dx injects assets and
     scripts and fills the title placeholder at build. -->
<html lang="en">
    <head>
        <title>{app_title}</title>
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta charset="UTF-8">
    </head>
    <body>
        <div id="main"></div>
        <!-- Runs before first paint, after the prerendered page is parsed.
             Puts the body on the stored theme so the page never flashes the
             default, and marks the document `js` so the stylesheet can hold
             the hero's entrance until the app has hydrated and runs it (the
             app adds `hydrated`). Without script neither class lands and the
             page shows its settled, prerendered self. -->
        <script>
            (function () {
                var root = document.documentElement;
                root.classList.add("js");
                // The app marks hydrated itself; if the wasm is slow, blocked
                // or broken, this does it instead, so the hero is never held
                // for longer than three seconds.
                setTimeout(function () { root.classList.add("hydrated"); }, 3000);

                // The figures roll rather than sit blank while the app loads,
                // each keeping the digit count it was prerendered with so the
                // row does not jump. If the app never arrives the real values
                // go back, which is what the timeout above is for.
                var nums = [].slice.call(document.querySelectorAll(".stat-num"));
                var real = nums.map(function (el) { return el.textContent; });
                var digits = real.map(function (t) { return (t.replace(/\D/g, "") || "1234").length; });
                var roll = setInterval(function () {
                    if (root.classList.contains("hydrated")) {
                        clearInterval(roll);
                        nums.forEach(function (el, i) { el.textContent = real[i]; });
                        return;
                    }
                    nums.forEach(function (el, i) {
                        var n = "";
                        for (var d = 0; d < digits[i]; d++) n += Math.floor(Math.random() * 10);
                        n = n.replace(/^0+(?=\d)/, "");
                        el.textContent = n.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
                    });
                }, 70);
                try {
                    var stored = JSON.parse(localStorage.getItem("zwipe.theme"));
                    if (stored && stored.name) {
                        document.body.className = "theme-" + stored.name + "-" + (stored.is_dark ? "dark" : "light");
                    }
                } catch (e) {}
            })();
        </script>
    </body>
</html>
