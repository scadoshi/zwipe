[package]
name = "components"
version.workspace = true
edition = "2024"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# Dioxus with its default features (macro/html/signals/hooks) but NO platform
# feature: each consuming app (zwiper, zite) enables its own web/mobile/
# fullstack, and cargo unifies; sharing components must not force a platform.
# The router draws the guides' links, which every client routes already.
dioxus = { version = "0.7.9", features = ["router"] }
uuid.workspace = true
# The swipe stack times a key press against the last card's exit on the browser's clock.
chrono.workspace = true
zwipe-core = { path = "../zwipe-core" }
# The screen logic the clients share: the color map's model, the chart bars
# and the changelog's filing, which this crate draws.
zwipe-ui = { path = "../zwipe-ui" }
# The generic UI kit: themes, panels, nav, charts and the entrance effects.
# Everything here that is not Magic is a re-export of it, pinned to a
# commit, on the same source as zwipe-ui's orangui-core so Cargo.lock holds
# one copy.
orangui = { git = "https://github.com/scadoshi/orangui", branch = "main" }
# The page keys' gg window, which the deck cursor matches.
orangui-core = { git = "https://github.com/scadoshi/orangui", branch = "main" }

# The hover stack's life and fade timers, the browser's setTimeout as a
# future. Off the browser the stack times nothing.
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers.workspace = true

[features]
# ToastStack and TOAST_CSS, for the apps.
toast = ["orangui/toast"]
# open_url and use_in_app_links, for the apps: links open in the in-app browser.
links = ["orangui/links"]

[dev-dependencies]
# Renders components to HTML in the golden test.
dioxus-ssr = "0.7"
# Builds card fixtures for the golden test.
serde_json = { workspace = true }
# The runtime the kit's sheets time their entrance on, off the browser, in the printing sheet's test.
tokio = { workspace = true }
