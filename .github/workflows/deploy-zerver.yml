name: Deploy zerver

on:
  push:
    branches: [main]
    paths:
      - 'zerver/**'
      - 'zwipe-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.sqlx/**'
      - '.github/workflows/deploy-zerver.yml'
  workflow_dispatch:

# The deploy job's token lives on the production box for the length of the
# run; read-only is all any job here needs.
permissions:
  contents: read

# build and deploy share one target dir on the VPS, so two runs must not
# interleave: run B's build would replace the binaries run A is about to
# install. A newer push waits; a third one replaces the waiting run.
concurrency:
  group: deploy-zerver
  cancel-in-progress: false

jobs:
  # Gate the deploy on the test suite. Runs on a GitHub-hosted runner with a
  # throwaway Postgres; the deploy job below only runs if this passes.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6 # the VPS version; a tag that moves is not a pin
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      SQLX_OFFLINE: "true" # compile against committed .sqlx; #[sqlx::test] uses DATABASE_URL at runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Test
        run: cargo test -p zwipe-core -p zerver

  # Format + lint gate (GitHub-hosted; the deploy below needs it too).
  lint:
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
      # zwiper's build.rs bakes these in; placeholders satisfy it for a lint build.
      BACKEND_URL: https://example.invalid
      RUST_LOG: info
      RUST_BACKTRACE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: rustfmt
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # zwiper's default (mobile) feature builds against webkit/GTK on Linux.
      # Cached by package list, so a hit restores the files without apt-get
      # update or downloads (about a minute on a cold install).
      - name: Install Dioxus system libraries
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libdbus-1-dev
          version: 1
      - name: Format
        run: cargo +nightly fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Broken intra-doc links and other rustdoc warnings fail the way clippy's do.
      - name: Docs
        run: cargo doc --workspace --no-deps --lib
        env:
          RUSTDOCFLAGS: -D warnings
      # zite is a binary crate, which --lib skips; it has no name collision of its own.
      - name: Docs (zite)
        run: cargo doc --no-deps -p zite
        env:
          RUSTDOCFLAGS: -D warnings
      - name: UI tests
        run: cargo test -p components -p zite -p zwiper

  # Builds the release binaries on the VPS while test and lint run on GitHub, so
  # the deploy only waits on the slower of the two. Building touches nothing in
  # production; migrations and the binary swap stay behind the gates below.
  #
  # The target dir lives outside the workspace because checkout's clean step
  # deletes ignored files, target/ included. Kept on the VPS's own disk it
  # stays warm between runs, where restoring it from actions/cache meant
  # downloading ~10 GB every deploy (3 of the job's 4 minutes).
  build:
    runs-on: self-hosted
    env:
      CARGO_TARGET_DIR: /home/runner/.cache/zwipe-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Build
        env:
          SQLX_OFFLINE: true
        run: cargo build --release --bin zerver --bin zervice

  # Runs as the `runner` user on the VPS. Its sudo covers stopping and starting
  # zerver, installing the two binaries from /home/runner/deploy, and reading
  # zerver's last log lines. /etc/zwipe/migrate.env holds only DATABASE_URL.
  deploy:
    needs: [test, lint, build] # blocked if tests or lints fail
    runs-on: self-hosted
    env:
      CARGO_TARGET_DIR: /home/runner/.cache/zwipe-target

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Run migrations
        run: |
          set -a
          source /etc/zwipe/migrate.env
          set +a
          cargo sqlx migrate run --source zerver/migrations

      # Fail fast if the committed .sqlx offline data has drifted from the
      # (just-migrated) prod schema — the exact failure mode of 2026-07-05.
      # Exclude the GUI crates: --check compiles crates to find their queries,
      # zwiper's Linux desktop deps (glib/GTK) don't exist on the headless VPS,
      # and only zerver has queries anyway (broke the 2026-07-06 deploy).
      - name: Verify offline query data
        run: |
          set -a
          source /etc/zwipe/migrate.env
          set +a
          cargo sqlx prepare --workspace --check -- --workspace --exclude zwiper --exclude zite

      # The old binaries are kept, and put back if zerver does not answer /health.
      - name: Deploy
        run: |
          set -euo pipefail
          D=/home/runner/deploy
          for b in zerver zervice; do
            cp "$CARGO_TARGET_DIR/release/$b" "$D/$b"
            cp "/usr/local/bin/$b" "$D/$b.previous"
          done
          sudo systemctl stop zerver
          sudo install -m 755 /home/runner/deploy/zerver /usr/local/bin/zerver
          sudo install -m 755 /home/runner/deploy/zervice /usr/local/bin/zervice
          sudo systemctl start zerver
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1 && break; sleep 1; done
          if curl -fsS http://127.0.0.1:3000/health; then
            echo; echo "zerver is serving"
          else
            echo "::error::zerver did not answer /health; putting the previous binaries back"
            sudo journalctl -u zerver -n 50 --no-pager || true
            sudo systemctl stop zerver
            for b in zerver zervice; do cp "$D/$b.previous" "$D/$b"; done
            sudo install -m 755 /home/runner/deploy/zerver /usr/local/bin/zerver
            sudo install -m 755 /home/runner/deploy/zervice /usr/local/bin/zervice
            sudo systemctl start zerver
            exit 1
          fi
