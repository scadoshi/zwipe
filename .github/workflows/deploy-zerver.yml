name: Deploy zerver

on:
  push:
    branches: [main]
    paths:
      - 'zerver/**'
      - 'zwipe-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.sqlx/**'
      - '.github/workflows/deploy-zerver.yml'
  workflow_dispatch:

# The deploy job's token lives on the production box for the length of the
# run; read-only is all any job here needs.
permissions:
  contents: read

jobs:
  # Gate the deploy on the test suite. Runs on a GitHub-hosted runner with a
  # throwaway Postgres; the deploy job below only runs if this passes.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6 # the VPS version; a tag that moves is not a pin
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      SQLX_OFFLINE: "true" # compile against committed .sqlx; #[sqlx::test] uses DATABASE_URL at runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test
        run: cargo test -p zwipe-core -p zerver

  # Format + lint gate (GitHub-hosted; the deploy below needs it too).
  lint:
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
      # zwiper's build.rs bakes these in; placeholders satisfy it for a lint build.
      BACKEND_URL: https://example.invalid
      RUST_LOG: info
      RUST_BACKTRACE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: nightly
          components: rustfmt
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # zwiper's default (mobile) feature builds against webkit/GTK on Linux.
      - name: Install Dioxus system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libdbus-1-dev
      - name: Format
        run: cargo +nightly fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: UI tests
        run: cargo test -p zwipe-components -p zite -p zwiper

  # Runs as the `runner` user on the VPS. Its sudo covers stopping and starting
  # zerver, installing the two binaries from /home/runner/deploy, and reading
  # zerver's last log lines. /etc/zwipe/migrate.env holds only DATABASE_URL.
  deploy:
    needs: [test, lint] # blocked if tests or lints fail
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '.sqlx/**') }}

      - name: Run migrations
        run: |
          set -a
          source /etc/zwipe/migrate.env
          set +a
          cargo sqlx migrate run --source zerver/migrations

      # Fail fast if the committed .sqlx offline data has drifted from the
      # (just-migrated) prod schema — the exact failure mode of 2026-07-05.
      # Exclude the GUI crates: --check compiles crates to find their queries,
      # zwiper's Linux desktop deps (glib/GTK) don't exist on the headless VPS,
      # and only zerver has queries anyway (broke the 2026-07-06 deploy).
      - name: Verify offline query data
        run: |
          set -a
          source /etc/zwipe/migrate.env
          set +a
          cargo sqlx prepare --workspace --check -- --workspace --exclude zwiper --exclude zite

      - name: Build
        env:
          SQLX_OFFLINE: true
        run: cargo build --release --bin zerver --bin zervice

      # The old binaries are kept, and put back if zerver does not answer /health.
      - name: Deploy
        run: |
          set -euo pipefail
          D=/home/runner/deploy
          for b in zerver zervice; do
            cp "target/release/$b" "$D/$b"
            cp "/usr/local/bin/$b" "$D/$b.previous"
          done
          sudo systemctl stop zerver
          sudo install -m 755 /home/runner/deploy/zerver /usr/local/bin/zerver
          sudo install -m 755 /home/runner/deploy/zervice /usr/local/bin/zervice
          sudo systemctl start zerver
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1 && break; sleep 1; done
          if curl -fsS http://127.0.0.1:3000/health; then
            echo; echo "zerver is serving"
          else
            echo "::error::zerver did not answer /health; putting the previous binaries back"
            sudo journalctl -u zerver -n 50 --no-pager || true
            sudo systemctl stop zerver
            for b in zerver zervice; do cp "$D/$b.previous" "$D/$b"; done
            sudo install -m 755 /home/runner/deploy/zerver /usr/local/bin/zerver
            sudo install -m 755 /home/runner/deploy/zervice /usr/local/bin/zervice
            sudo systemctl start zerver
            exit 1
          fi
