name: Deploy web

# Builds zwiper-web and uploads it to the Cloudflare Pages project zwipe-app,
# served at app.zwipe.net. Runs on a push to main that touches the web app or
# anything it builds from, and by hand from the Actions tab. It needs the repo
# secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and
# CLOUDFLARE_ACCOUNT_ID.
#
# The tests and the release build run side by side; the upload waits on both,
# so a deploy takes the longer of the two, not their sum.
on:
  push:
    branches: [main]
    paths:
      - 'zwiper-web/**'
      - 'zwipe-core/**'
      - 'zwipe-client/**'
      - 'zwipe-ui/**'
      - 'components/**'
      - 'Cargo.lock'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a deploy still running; the site only ever needs
# the latest build.
concurrency:
  group: deploy-web
  cancel-in-progress: true

env:
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: web-test

      - name: Test
        run: cargo test -p zwiper-web

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The API the build talks to; build.rs bakes it in.
      BACKEND_URL: https://api.zwipe.net
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: web-wasm
          cache-all-crates: true

      - name: Install dioxus-cli
        # A prebuilt dx, matched to the workspace dioxus version, as in
        # deploy-zite.yml; compiling it would cost minutes.
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: dioxus-cli@0.7.10

      - name: Build
        working-directory: zwiper-web
        run: dx build --release --platform web

      - name: Add headers
        # No 404.html: Pages then serves index.html with a 200 for app routes.
        run: cp zwiper-web/deploy/_headers target/dx/zwiper-web/release/web/public/_headers

      - name: Hand the site to the deploy job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: target/dx/zwiper-web/release/web/public
          retention-days: 1

  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site

      - name: Deploy to Cloudflare Pages
        # Direct Upload; --branch main publishes to production (app.zwipe.net).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4.151.2 pages deploy site
          --project-name zwipe-app
          --branch main
          --commit-hash "${GITHUB_SHA}"
          --commit-dirty=true
