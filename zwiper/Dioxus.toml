[application]
name = "Zwipe"

[bundle]
identifier = "com.scadoshi.zwipe"
publisher = "scadoshi"

[web.app]

# HTML title tag content
title = "zwipe"

# Additional CSS style files
style = ["/main.css"]

[ios.plist]
CFBundlePackageType = "APPL"
# Without this, iOS KILLS the app (privacy violation, not a catchable panic)
# when the user hard-presses a card image and picks "Save to Camera Roll".
NSPhotoLibraryAddUsageDescription = "Zwipe saves card images you choose to your photo library."
MinimumOSVersion = "16.0"
DTPlatformName = "iphoneos"
DTPlatformVersion = "27.0"
DTSDKName = "iphoneos27.0"
DTXcode = "2700"
DTXcodeBuild = "27A266a"
DTCompiler = "com.apple.compilers.llvm.clang.1_0"
UISupportedInterfaceOrientations = ["UIInterfaceOrientationPortrait"]
"UISupportedInterfaceOrientations~ipad" = ["UIInterfaceOrientationPortrait"]

# iOS 27 traps at launch on any app that has not adopted the UIScene lifecycle.
# UIKit decides adoption from this key alone, so it has to be in the bundle;
# tao registers TaoSceneDelegate and hands UIKit the configuration at runtime.
[ios.plist.UIApplicationSceneManifest]
UIApplicationSupportsMultipleScenes = false

[web.resource.dev]
