# cargo-audit's settings, read by `cargo audit` locally and in
# .github/workflows/audit.yml.

[advisories]
# RUSTSEC-2026-0459: libsqlite3-sys 0.30.1 bundles a C SQLite with
# CVE-2026-119375; fixed in libsqlite3-sys 0.39.0.
#
# It is in Cargo.lock only because Cargo locks every optional dependency:
# sqlx 0.9.0, the latest release, has an optional sqlx-sqlite that requires
# libsqlite3-sys >=0.30.1, <0.38. zerver enables sqlx's postgres driver
# alone, so no SQLite code is compiled or shipped, and no lockfile update can
# reach 0.39 while that bound stands. audit.yml's "SQLite stays out of the
# build" step fails if libsqlite3-sys ever enters the build graph, which
# would make this ignore wrong.
#
# Revisit on the next sqlx release: sqlx's main branch already allows
# libsqlite3-sys <0.40. Once a release does, `cargo update -p sqlx` should
# lock 0.39 or later; drop this entry then. Issue 320.
ignore = ["RUSTSEC-2026-0459"]
