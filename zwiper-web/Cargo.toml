[package]
name = "zwiper-web"
version.workspace = true
authors = ["scottyrayfermo"]
edition = "2024"

[lints]
workspace = true

[lib]
name = "zwiper_web"
path = "src/lib/lib.rs"

[[bin]]
name = "zwiper-web"
path = "src/main.rs"

[features]
default = ["web"]
web = ["dioxus/web"]

[dependencies]
zwipe-core = { path = "../zwipe-core" }
zwipe-client = { path = "../zwipe-client" }
components = { path = "../components", features = ["toast"] }
dioxus = { version = "0.7.10", features = ["router"] }
# The toast handle (`use_toast`) the screens raise toasts through; the same
# commit orangui's ToastStack is built on.
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "02801f27e4b3e30606e5c77e435c9d955c708eb3", version = "0.0.1", default-features = false }
chrono = { workspace = true }
# For `Url`, which the client takes its base address as.
reqwest = { version = "0.12.23", default-features = false }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
# The single-flight refresh lock and its answer channel; `sync` builds for
# wasm32 as well.
tokio = { version = "1.47.1", default-features = false, features = ["sync"] }

# The browser build: localStorage for the session and theme, the browser's
# timer for the upkeep loop, the console for logs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }
gloo-timers = { version = "0.4", features = ["futures"] }
# getrandom 0.4+ needs the browser backend named for wasm32-unknown-unknown.
getrandom = { version = "0.4", features = ["wasm_js"] }

# The native build exists for the workspace lint and the tests; its timer
# is tokio's.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.47.1", default-features = false, features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1.47.1", features = ["macros", "rt", "time", "test-util"] }
